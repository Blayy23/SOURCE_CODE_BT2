<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TDOU WEB</title>
    <link rel="stylesheet" href="styles/main.css" type="text/css"/>
</head>
<body>
	<img src="images/UTE.jpg" alt="Logo" width="100">
    <h1>Survey</h1>
    <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>
	
	<h2>Your information:</h2>
    <form action="emailList" method="post">
        <input type="hidden" name="action" value="add">
        
        <label>First Name:</label>
        <input type="text" name="firstName" required><br>
        
		<label>Last Name:</label>
		<input type="text" name ="lastName" required><br>
		
        <label>Email:</label>
        <input type="email" name="email" required><br>

		<label>Date of Birth:</label>
		<input type="date" name ="date" required><br>

	<h2>How did you hear about us?</h2>
		<label>
			<input type = "radio" id ="search" name ="heardFrom" value="Search engine" checked>
			Search engine
		</label>
	
		<label>
			<input type = "radio" id ="wom" name = "heardFrom" value ="Word of mouth">
			Word of mouth
		</label>
		
		<label>
			<input type ="radio" id = "social" name ="heardFrom" value = "Social Media">						
			Social Media
		</label>
		
		<label>
			<input type ="radio" id ="other" name ="heardFrom" value ="Other">
			Other
		</label><br>
		
	<h2>Would you like to receive announcements about new CDs and special offers?</h2>		
        
  		<label>
    		<input type="checkbox" name="wantUpdates" value="yes">
    		YES, I'd like that.
		</label><br>
        
        <label>
        	<input type = "checkbox" name = "sendAnnouncements" value ="yes">
        	YES, please send me announcements.
        </label><br>
       
        <label>
        	Please contact me by:
	        <select name = "contactVia" >
	        	<option value="Both">Email or postal mail</option>
	        	<option value="Email">Email only</option>
	        	<option value="Postal">Postal mail only</option>
	        </select>
	      
        </label><br>
       
        <label>&nbsp;</label>
        <input type="submit" value="Submit" id="submit">
    </form>
</body>
</html>
